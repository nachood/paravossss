<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Para vos ♥</title>
  <style>
    :root {
      color-scheme: light;
      --wine: #6c2140;
      --rose: #e98aaa;
      --cream: #fff8fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 239, 247, .7), transparent 27%),
        radial-gradient(circle at 88% 84%, rgba(255, 150, 190, .48), transparent 32%),
        linear-gradient(145deg, #6d2141, #bd557c 52%, #e58eaa);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      width: min(100%, 760px);
      padding: 24px 18px 34px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #ffe3ec;
      font: 600 11px/1.3 Arial, sans-serif;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .reveal-button {
      position: relative;
      display: block;
      width: 100%;
      margin: 0;
      padding: 22px 16px 24px;
      border: 1px solid rgba(255, 238, 245, .58);
      border-radius: 28px;
      color: var(--cream);
      background: rgba(255, 225, 237, .18);
      box-shadow: 0 18px 65px rgba(96, 20, 51, .25), inset 0 1px rgba(255,255,255,.3);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .5s ease, border-color .5s ease;
    }

    .reveal-button:focus-visible {
      outline: 3px solid #ffc4d4;
      outline-offset: 5px;
    }

    .message {
      display: block;
      position: relative;
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 55px clamp(48px, 11vw, 84px) 42px;
      border: 2px solid rgba(236, 143, 174, .48);
      border-radius: 9px;
      color: var(--wine);
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 207, 225, .55), transparent 42%),
        linear-gradient(110deg, rgba(255, 247, 251, .98), rgba(255, 255, 255, .98) 48%, rgba(255, 241, 247, .98));
      box-shadow: 0 10px 22px rgba(93, 23, 50, .18), inset 0 0 0 6px rgba(255, 224, 235, .42);
      font-size: clamp(22px, 5.1vw, 37px);
      font-weight: 800;
      line-height: 1.28;
      text-wrap: balance;
      text-align: left;
      transition: opacity .7s ease, transform .7s ease;
    }

    .message::before {
      content: "Para mi personita favorita:";
      position: absolute;
      top: 20px;
      left: clamp(48px, 11vw, 84px);
      color: #a54669;
      font-size: clamp(13px, 3vw, 17px);
      font-style: italic;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .message::after {
      content: "♥";
      position: absolute;
      right: 20px;
      bottom: 12px;
      color: #d95b87;
      font-size: 20px;
    }

    .letter-tulips {
      position: absolute;
      top: 51%;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: #f083a8;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
      font-size: clamp(17px, 4.5vw, 28px);
      line-height: .8;
      filter: drop-shadow(0 2px 3px rgba(175, 57, 100, .2));
      transform: translateY(-50%);
      pointer-events: none;
    }

    .letter-tulips.left {
      left: 8px;
      align-items: flex-start;
    }

    .letter-tulips.right {
      right: 8px;
      align-items: flex-end;
    }

    .letter-tulips span:nth-child(1) { transform: rotate(-9deg); }
    .letter-tulips span:nth-child(2) { transform: translateX(6px) rotate(8deg); }
    .letter-tulips span:nth-child(3) { transform: rotate(-4deg); }

    .tap-hint {
      display: block;
      margin-top: 16px;
      color: #ffe5ee;
      font: 12px/1.4 Arial, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: opacity .45s ease;
    }

    .reveal-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      max-height: 0;
      opacity: 0;
      overflow: visible;
      pointer-events: none;
      transition: min-height 1s ease, max-height 1s ease, opacity .8s ease;
    }

    .photo-frame {
      position: relative;
      z-index: 2;
      width: min(100%, 515px);
      padding: 13px 13px 52px;
      background: #fffaf5;
      box-shadow: 0 22px 45px rgba(91, 18, 49, .35), 0 0 0 1px rgba(80, 15, 35, .1);
      transform: scale(.82) rotate(-2deg);
      transition: transform 1.25s cubic-bezier(.2,.8,.2,1);
    }

    .photo-frame img {
      display: block;
      width: 100%;
      height: auto;
      filter: saturate(.88) contrast(1.04);
    }

    .caption {
      position: absolute;
      right: 10px;
      bottom: 13px;
      left: 10px;
      color: #70203d;
      font-size: clamp(15px, 3.7vw, 23px);
      font-weight: 700;
      letter-spacing: .015em;
    }

    .heart {
      position: absolute;
      z-index: 3;
      color: #ffb5ca;
      font-family: Arial, sans-serif;
      font-size: clamp(20px, 5vw, 34px);
      line-height: 1;
      opacity: 0;
      text-shadow: 0 2px 12px rgba(255, 121, 163, .65);
      animation: heart-open 1.15s var(--delay) both, heart-float 3.8s calc(var(--delay) + 1.2s) ease-in-out infinite;
    }

    .h1 { --delay: .05s; left: 7%; top: 13%; transform: rotate(-18deg); }
    .h2 { --delay: .16s; left: 20%; top: 1%; transform: rotate(12deg); }
    .h3 { --delay: .28s; left: 42%; top: -8%; transform: rotate(-8deg); }
    .h4 { --delay: .4s; right: 24%; top: 0%; transform: rotate(18deg); }
    .h5 { --delay: .52s; right: 7%; top: 15%; transform: rotate(-12deg); }
    .h6 { --delay: .64s; right: 0%; top: 43%; transform: rotate(15deg); }
    .h7 { --delay: .76s; right: 8%; bottom: 15%; transform: rotate(-20deg); }
    .h8 { --delay: .88s; right: 29%; bottom: 0%; transform: rotate(9deg); }
    .h9 { --delay: 1s; left: 30%; bottom: -4%; transform: rotate(-14deg); }
    .h10 { --delay: 1.12s; left: 8%; bottom: 13%; transform: rotate(16deg); }
    .h11 { --delay: 1.24s; left: 0%; top: 43%; transform: rotate(-13deg); }

    @keyframes heart-open {
      from { opacity: 0; transform: scale(.35) rotate(0deg); }
      to { opacity: .95; }
    }

    @keyframes heart-float {
      0%, 100% { margin-top: 0; }
      50% { margin-top: -7px; }
    }

    .reveal-button.is-revealed {
      border-color: rgba(255, 200, 216, .42);
      background: rgba(255, 242, 245, .04);
    }

    .is-revealed .message {
      opacity: 0;
      transform: translateY(-12px);
      height: 0;
      overflow: hidden;
      padding: 0;
    }

    .is-revealed .tap-hint { opacity: 0; height: 0; margin: 0; }
    .is-revealed .reveal-stage {
      min-height: min(82vw, 560px);
      max-height: 900px;
      opacity: 1;
      pointer-events: auto;
    }
    .is-revealed .photo-frame { transform: scale(1) rotate(-2deg); }

    .footer {
      margin: 20px 0 0;
      color: rgba(255, 235, 242, .88);
      font: 12px/1.4 Arial, sans-serif;
    }

    @media (max-width: 430px) {
      .page { padding-inline: 13px; }
      .reveal-button { border-radius: 22px; }
      .photo-frame { padding: 9px 9px 42px; }
      .message { padding-inline: 42px; }
      .message::before { left: 42px; }
      .letter-tulips { font-size: 19px; }
      .caption { bottom: 10px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Una invitación especial</p>

    <button class="reveal-button" id="revealButton" type="button" aria-expanded="false">
      <span class="message">
        <span class="letter-tulips left" aria-hidden="true"><span>🌷</span><span>🌷</span><span>🌷</span></span>
        <span class="letter-tulips right" aria-hidden="true"><span>🌷</span><span>🌷</span><span>🌷</span></span>
        ¿Hoy querés estar conmigo para ver los Worlds de LoL juntitos, acompañados por…?
      </span>
      <span class="tap-hint">Tocá el mensaje para descubrirlo</span>

      <span class="reveal-stage" aria-hidden="true">
        <span class="heart h1">♥</span>
        <span class="heart h2">♥</span>
        <span class="heart h3">♥</span>
        <span class="heart h4">♥</span>
        <span class="heart h5">♥</span>
        <span class="heart h6">♥</span>
        <span class="heart h7">♥</span>
        <span class="heart h8">♥</span>
        <span class="heart h9">♥</span>
        <span class="heart h10">♥</span>
        <span class="heart h11">♥</span>

        <span class="photo-frame">
          <img src="WhatsApp%20Image%202026-10-15%20at%2008.05.09.jpeg" alt="Una foto de ella mostrando sus hermosas uñas" />
          <span class="caption">DE LAS HERMOSAS UÑAS QUE TENÉS ❤.❤</span>
        </span>
      </span>
    </button>

    <p class="footer">¿Aceptás, sí?</p>
  </main>

  <script>
    const revealButton = document.getElementById('revealButton');
    const stage = revealButton.querySelector('.reveal-stage');

    revealButton.addEventListener('click', () => {
      const isRevealed = revealButton.classList.toggle('is-revealed');
      revealButton.setAttribute('aria-expanded', String(isRevealed));
      stage.setAttribute('aria-hidden', String(!isRevealed));
    });
  </script>
</body>
</html>
